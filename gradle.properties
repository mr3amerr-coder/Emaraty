org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# AGP 9 built-in Kotlin is disabled so this project can pin the requested
# standalone Kotlin 2.4.21 compiler consistently with Compose and KSP.
# The legacy DSL switch is required by the external Kotlin Android plugin path.
android.builtInKotlin=false
android.newDsl=false
