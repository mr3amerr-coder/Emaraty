name: Build Amaraty APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amaraty-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # This installs Gradle 9.9.2 on PATH. The checked-in gradlew bootstrap
      # delegates to that executable, so an official wrapper JAR is not needed
      # for this GitHub Actions workflow.
      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 17 SDK (API 37.1 or newer)
        run: |
          set -euo pipefail
          # Select the newest published API 37.x platform, since the Compose
          # 1.13 libraries in this project require API 37.1 or later.
          sdkmanager --list --channel=3 > sdk-packages.txt
          cat sdk-packages.txt
          platform_package="$(grep -oE 'platforms;android-37\\.[0-9]+' sdk-packages.txt | sort -Vu | tail -n 1)"
          if [[ -z "$platform_package" ]]; then
            echo "No Android 37.1+ SDK platform package was found." >&2
            exit 1
          fi

          sdkmanager --channel=3 "$platform_package" "build-tools;37.0.0"

          # This project's compileSdk is 37; make its expected SDK directory
          # resolve to the selected 37.x platform metadata.
          platform_dir="${platform_package#platforms;}"
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s "$platform_dir" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Verify Java, Gradle and Android SDK
        run: |
          java -version
          gradle --version
          test -e "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      - name: Build APK and run verification
        run: |
          bash ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :core:domain:test

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: amaraty-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add build instructions to summary
        if: success()
        run: |
          {
            echo '## Amaraty APK created'
            echo ''
            echo 'Download **amaraty-debug-apk** from the Artifacts section below this workflow run.'
            echo ''
            echo 'This is a debug build for testing, not a Play Store release build.'
          } >> "$GITHUB_STEP_SUMMARY"
