name: Build Amaraty APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amaraty-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      # The repository's gradlew is a bootstrap shim. This action installs
      # Gradle 9.9.2 on PATH; gradlew then delegates to that executable.
      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.9.2'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 17 SDK (API 37)
        run: |
          set -euo pipefail
          sdkmanager --channel=3 \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Verify Java, Gradle and Android SDK
        run: |
          java -version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Build APK and run verification
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :core:domain:test

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: amaraty-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add build instructions to summary
        if: success()
        run: |
          {
            echo '## Amaraty APK created'
            echo ''
            echo 'Download **amaraty-debug-apk** from the Artifacts section below this workflow run.'
            echo ''
            echo 'This is a debug build for testing, not a Play Store release build.'
          } >> "$GITHUB_STEP_SUMMARY"
